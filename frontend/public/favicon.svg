<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0d0d0f"/>
  <!-- Torus knot simplified as layered rings -->
  <circle cx="32" cy="32" r="20" stroke="#00d4ff" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.5"/>
  <circle cx="32" cy="32" r="13" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  <!-- Code brackets -->
  <path d="M20 24 L13 32 L20 40" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 24 L51 32 L44 40" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center dot glow -->
  <circle cx="32" cy="32" r="4" fill="#00d4ff" opacity="0.9"/>
  <circle cx="32" cy="32" r="7" fill="#00d4ff" opacity="0.15"/>
